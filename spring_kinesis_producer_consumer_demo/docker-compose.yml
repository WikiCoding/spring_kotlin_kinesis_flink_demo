services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: localstack-kinesis
    ports:
      - "4566:4566"
    environment:
      - SERVICES=kinesis
      - DEBUG=1
    volumes:
      - "./.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
