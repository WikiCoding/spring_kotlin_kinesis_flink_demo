spring.application.name=demo

# LocalStack Kinesis endpoint
aws.kinesis.endpoint=http://localhost:4566
aws.region=us-east-1
aws.access-key=test
aws.secret-key=test

# Kinesis consumer config
kinesis.streams=appuser-stream,userrole-stream,user-enriched-stream
kinesis.consumer.iterator-type=TRIM_HORIZON
kinesis.consumer.poll-limit=100
kinesis.consumer.poll-delay-ms=100
kinesis.consumer.error-retry-delay-ms=1000
